<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CER-01 PC Setup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Rubik+Glitch&display=swap">
<style>
/* Devs-only gate for the setup page: the real page below is encrypted with the access code (site.py lock); this screen asks for it. */
:root{--void:#07050c;--panel:#0f0a1a;--line:#2a1745;--blood:#ff2a4d;--acid:#19f0ff;--violet:#b026ff;--bone:#e8e3f0;--dim:#a89cc0;color-scheme:dark}
*{box-sizing:border-box}
html{background:#050308}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--bone);font:14px/1.6 'IBM Plex Mono',ui-monospace,Consolas,monospace;
  background:repeating-linear-gradient(0deg,#0000 0 2px,#0000002e 2px 3px),radial-gradient(900px 500px at 70% 0%,#2a0a3a66,transparent),radial-gradient(700px 400px at 0% 100%,#3a0a1a44,transparent),var(--void)}
.gate{width:min(420px,100%);padding:28px 24px 22px;border:1px solid var(--violet);border-radius:30px 6px 30px 6px;background:#0f0a1ae6;box-shadow:0 0 40px #b026ff33,0 0 40px #b026ff14 inset}
.eye{font:600 11px 'Chakra Petch',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#d9a6ff}
h1{margin:6px 0 8px;font:400 clamp(34px,10vw,52px)/1 'Rubik Glitch',Impact,sans-serif;text-shadow:3px 0 var(--blood),-3px 0 var(--acid)}
p{margin:0 0 18px;color:var(--dim)}
form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
input{min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:10px 2px 10px 2px;background:#05040a;color:var(--bone);font:700 22px 'Chakra Petch',sans-serif;letter-spacing:.5em;text-align:center}
input:focus{outline:none;border-color:var(--acid);box-shadow:0 0 14px #19f0ff55}
button{padding:0 18px;border:0;border-radius:10px 2px 10px 2px;background:var(--violet);color:var(--void);font:700 12px 'Chakra Petch',sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 16px #b026ff88}
button:disabled{opacity:.5;cursor:wait}
.msg{min-height:1.6em;margin:10px 0 0;font-size:12px;color:var(--blood)}
.gate.bad{animation:shake .35s}
@keyframes shake{25%{translate:-8px}75%{translate:8px}}
label{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--dim);font-size:12px;cursor:pointer}
label input{width:16px;height:16px;padding:0;accent-color:var(--violet)}
a{display:inline-block;margin-top:14px;color:var(--acid);font-size:12px}
@media(prefers-reduced-motion:reduce){.gate.bad{animation:none}}
</style></head><body>
<main class="gate" id="gate">
  <div class="eye" id="eye"></div>
  <h1 id="h1"></h1>
  <p id="lede"></p>
  <form id="f" autocomplete="off"><input id="code" type="password" inputmode="numeric" maxlength="12" required aria-labelledby="h1"><button id="go" type="submit"></button></form>
  <label><input type="checkbox" id="keep" checked><span id="keepl"></span></label>
  <div class="msg" id="msg" role="alert"></div>
  <a id="back" href="index.html"></a>
</main>

var KEY='cer01-setup-code',S=crypto.subtle;
function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open(code){
  var base=await S.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);
  var k=new Uint8Array(await S.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(L.s),iterations:L.i},base,512));
  var ct=b(L.c),mk=await S.importKey('raw',k.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  if(!await S.verify('HMAC',mk,b(L.t),ct))return null;
  var n=Math.ceil(ct.length/32),jobs=[];

  var ks=await Promise.all(jobs),out=new Uint8Array(ct.length);
  for(var j=0;j<ct.length;j++)out[j]=ct[j]^new Uint8Array(ks[j>>5])[j&31];
  return new TextDecoder().decode(out);
}
