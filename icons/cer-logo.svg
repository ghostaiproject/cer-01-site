<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1c0f30"/><stop offset=".6" stop-color="#0c0816"/><stop offset="1" stop-color="#07050c"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- the C: thick open ring, split red/cyan like a misaligned CRT -->
  <g fill="none" stroke-width="58" stroke-linecap="butt">
    <path d="M352 168 A128 128 0 1 0 352 344" stroke="#ff2a4d" transform="translate(-9 0)" opacity=".95" filter="url(#glow)"/>
    <path d="M352 168 A128 128 0 1 0 352 344" stroke="#19f0ff" transform="translate(9 0)" opacity=".95" filter="url(#glow)"/>
    <path d="M352 168 A128 128 0 1 0 352 344" stroke="#e8e3f0"/>
  </g>
  <!-- terminal cursor in the mouth of the C -->
  <rect x="300" y="226" width="64" height="60" rx="6" fill="#c6ff1a" filter="url(#glow)"/>
</svg>
